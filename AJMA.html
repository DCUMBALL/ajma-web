<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>AJMÁ - Catálogo</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #fafafa;
}

/* HEADER */
header {
    text-align: center;
    padding: 20px;
    background: #c96a8a;
    color: white;
}

/* GALERÍA */
.galeria {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 5px;
    padding: 5px;
}

.item {
    position: relative;
    overflow: hidden;
}

.item img {
    width: 100%;
    height: 250px;
    object-fit: cover;
    transition: 0.3s;
}

/* EFECTO HOVER */
.overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    opacity: 0;
    transition: 0.3s;
}

.item:hover img {
    transform: scale(1.1);
}

.item:hover .overlay {
    opacity: 1;
}

.boton {
    margin-top: 10px;
    padding: 8px 15px;
    background: #25D366;
    color: white;
    text-decoration: none;
    border-radius: 5px;
}

footer {
    text-align: center;
    padding: 15px;
    background: #eee;
}
</style>

</head>

<body>

<header>
    <h1>AJMÁ</h1>
    <p>Obsequios personalizados tejidos a mano</p>
</header>

<div class="galeria">

    <div class="item">
        <img src="img/producto1.jpg">
        <div class="overlay">
            <h3>Amigurumi</h3>
            <p>Personalizado</p>
            <a class="boton" href="https://wa.me/593987987190">Comprar</a>
        </div>
    </div>

    <div class="item">
        <img src="img/producto2.jpg">
        <div class="overlay">
            <h3>Llaveros</h3>
            <p>Desde $5</p>
            <a class="boton" href="https://wa.me/593987987190">Comprar</a>
        </div>
    </div>

    <div class="item">
        <img src="img/producto3.jpg">
        <div class="overlay">
            <h3>Regalos tejidos</h3>
            <p>A pedido</p>
            <a class="boton" href="https://wa.me/593987987190">Comprar</a>
        </div>
    </div>

</div>

<footer>
    <p>📞 +593 98 798 7190</p>
</footer>

</body>
</html>
